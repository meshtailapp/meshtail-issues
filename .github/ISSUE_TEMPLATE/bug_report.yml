name: Bug report
description: Report something that is not working in Meshtail.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Meshtail. Search existing issues first and add to an existing report when it matches.
        **Reports and attachments here are public.** Do not post passwords, radio/channel keys, private messages, precise locations, or unreviewed logs.
        For private diagnostics or security concerns, email **support@meshtail.app** instead. Never publish a full app backup.
  - type: input
    id: app-version
    attributes:
      label: Meshtail version and build
      placeholder: "Example: 1.2.40 (52); shown in Settings > Diagnostics & about"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Phone platform
      placeholder: Android
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Install source
      placeholder: Google Play testing or sideload APK
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and OS version
      placeholder: "Example: Pixel 8, Android 16. Do not include serial numbers or Android IDs."
  - type: input
    id: radio
    attributes:
      label: Radio model, firmware version, and connection type
      placeholder: "Example: RAK4631, firmware version, Bluetooth / USB / Wi-Fi. No keys or device addresses."
  - type: dropdown
    id: area
    attributes:
      label: Affected feature
      options:
        - Connection or switching radios
        - Chats and channels
        - Room servers
        - Contacts and discovery
        - Repeater Manager, alarms, or clocks
        - Maps and offline downloads
        - Settings, onboarding, or updates
        - Layout, keyboard, or accessibility
        - Crash, freeze, or performance
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include whether it happens every time and whether the app was online or offline.
      placeholder: "1. Open...\n2. Tap...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the visible error text after removing private information.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshots or additional context
      description: Crop or redact names, messages, keys and locations first. Send diagnostics privately by email and mention the issue number.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing reports for this problem.
          required: true
        - label: I understand this report is public and have removed private information from its text and attachments.
          required: true
